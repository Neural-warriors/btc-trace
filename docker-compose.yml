version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:ro
      - ./outputs:/app/outputs:ro
      - ./reports:/app/reports:ro
      - ./configs:/app/configs:ro
    environment:
      - BTC_TRACE_DATA_DIR=/app/data
      - BTC_TRACE_MODELS_DIR=/app/models
      - BTC_TRACE_OUTPUTS_DIR=/app/outputs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://backend:8000

  # Optional: DuckDB doesn't need a separate service (embedded)
